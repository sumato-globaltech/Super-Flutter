      - farmer
    labels:
      accepted_at: Accepted on
      cancel_reason: Cancel reason
      cancelled_at: Cancelled on
      driver.code: Driver code
      driver.name: Driver
      driver.phone: Phone
      number: Shipment
      picked_up_at: Picked up on
      pickup.address: Pickup address
      pickup.late: Picked up late
      pickup.preferred_on: Preferred pickup
      reached_at: Reached on
      received_at: Received on
      reject_reason: Reject reason
      rejected_at: Rejected on
      requested_at: Requested on
      status.label: Status
