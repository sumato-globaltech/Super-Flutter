    feature: shipments
    screen: shipments
    call: getShipments
    source_feature: shipments
    model: ShipmentModel
    model_feature: shipments
    list: true
    paged: true
    show:
      - number
      - requested_at
      - accepted_at
      - rejected_at
    hide:
      - id
      - reject_reason
      - picked_up_at
      - reached_at
      - received_at
    open: shipmentDetail
    files:
      lib/features/shipments/presentation/shipments/bloc/shipments_bloc.dart: 5c3550de8d52484d
