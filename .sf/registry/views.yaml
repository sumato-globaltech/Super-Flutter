# The choices each view was drawn with. sf make api and sf refresh view
# read them; edit with their --show, --hide, --label and --pair flags.
version: 1
views:
  - bloc: QueueSummaryBloc
    feature: help_desk
    screen: queue_summary
    call: getQueueSummary
    source_feature: help_desk
    model: QueueSummaryModel
    model_feature: help_desk
    show:
      - open
      - overdue_follow_ups
      - resolved_today
      - unassigned
    labels:
      open: My open tickets
      overdue_follow_ups: My overdue follow-ups
      resolved_today: Resolved today
      unassigned: Waiting for an agent
    files:
      lib/features/help_desk/presentation/queue_summary/bloc/queue_summary_bloc.dart: c8bb4dc712c840db
